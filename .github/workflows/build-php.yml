name: Build PocketMine PHAR

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Download pp.zip from MediaFire
        run: |
          echo "Descargando pp.zip..."
          curl -L -o pp.zip "https://www.mediafire.com/file/hrn7qurvg5htlnx/pp.zip/file" --silent -f || \
          wget --content-disposition -O pp.zip "https://www.mediafire.com/file/hrn7qurvg5htlnx/pp.zip/file"
          ls -lh pp.zip

      - name: Build PHAR
        run: |
          cat > build-phar.php << 'EOL'
          <?php
          $zipFile = 'pp.zip';
          $pharFile = 'Submarine.phar';
          
          echo "Iniciando construcción del PHAR...\n";
          
          if (!file_exists($zipFile)) {
              die("Error: No se encontró pp.zip\n");
          }
          
          $phar = new Phar($pharFile);
          $phar->startBuffering();
          
          $stub = <<<'STUB'
          <?php
          define("pocketmine\\PATH", "phar://" . __FILE__ . "/");
          require_once("phar://" . __FILE__ . "/src/pocketmine/PocketMine.php");
          __HALT_COMPILER(); ?>
          STUB;
          
          $phar->setStub($stub);
          
          $zip = new ZipArchive;
          if ($zip->open($zipFile) !== TRUE) {
              die("No se pudo abrir pp.zip\n");
          }
          
          $total = $zip->numFiles;
          echo "Archivos encontrados: $total\n";
          
          for ($i = 0; $i < $total; $i++) {
              $name = $zip->getNameIndex($i);
              if (substr($name, -1) !== '/' && strpos($name, 'build-') === false) {
                  $phar->addFromString($name, $zip->getFromIndex($i));
              }
              if ($i % 800 === 0) {
                  echo "\rProcesando: " . round(($i / $total) * 100, 1) . "%";
              }
          }
          
          $zip->close();
          $phar->stopBuffering();
          
          echo "\nAplicando compresión GZ...\n";
          $phar->compressFiles(Phar::GZ);
          
          echo "\n¡PHAR creado exitosamente!\n";
          echo "Nombre: $pharFile\n";
          echo "Tamaño: " . round(filesize($pharFile) / (1024*1024), 2) . " MB\n";
          ?>
          EOL
          
          # Ejecutar con phar.readonly desactivado
          php -d phar.readonly=0 build-phar.php

      - name: Upload PHAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Submarine-PHAR
          path: Submarine.phar
          retention-days: 30

      - name: Show file info
        run: ls -lh *.phar
