name: Build PocketMine PHAR

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Download pp.zip from MediaFire
        run: |
          echo "Descargando pp.zip desde MediaFire..."
          wget -O pp.zip "https://www.mediafire.com/file/hrn7qurvg5htlnx/pp.zip/file" --quiet || \
          curl -L -o pp.zip "https://www.mediafire.com/file/hrn7qurvg5htlnx/pp.zip/file" --silent
          
          # MediaFire sometimes redirects, try to get direct link if needed
          if [ ! -s pp.zip ] || [ $(stat -c %s pp.zip) -lt 100000 ]; then
            echo "Intentando obtener enlace directo de MediaFire..."
            # This is a common workaround, but MediaFire changes often
            wget --content-disposition "https://www.mediafire.com/file/hrn7qurvg5htlnx/pp.zip/file" -O pp.zip
          fi
          
          ls -lh pp.zip
          echo "Tamaño del ZIP: $(du -h pp.zip | cut -f1)"

      - name: Create build script
        run: |
          cat > build-phar.php << 'EOL'
          <?php
          $zipFile = 'pp.zip';
          $pharFile = 'Submarine.phar';
          
          echo "Iniciando construcción del PHAR...\n";
          
          if (!file_exists($zipFile)) {
              die("Error: No se encontró pp.zip\n");
          }
          
          $phar = new Phar($pharFile);
          $phar->startBuffering();
          
          // Stub proporcionado
          $stub = <<<'STUB'
          <?php
          define("pocketmine\\PATH", "phar://" . __FILE__ . "/");
          require_once("phar://" . __FILE__ . "/src/pocketmine/PocketMine.php");
          __HALT_COMPILER(); ?>
          STUB;
          
          $phar->setStub($stub);
          
          $zip = new ZipArchive;
          if ($zip->open($zipFile) !== TRUE) {
              die("No se pudo abrir pp.zip\n");
          }
          
          $total = $zip->numFiles;
          echo "Archivos encontrados: $total\n";
          
          for ($i = 0; $i < $total; $i++) {
              $name = $zip->getNameIndex($i);
              if (substr($name, -1) !== '/' && strpos($name, 'build-') === false) {
                  $phar->addFromString($name, $zip->getFromIndex($i));
              }
              if ($i % 1000 === 0) {
                  echo "\rProcesando: " . round(($i / $total) * 100) . "%";
              }
          }
          
          $zip->close();
          $phar->stopBuffering();
          
          // Compresión GZ
          echo "\nAplicando compresión GZ...\n";
          $phar->compressFiles(Phar::GZ);
          
          echo "¡PHAR creado exitosamente!\n";
          echo "Nombre: $pharFile\n";
          echo "Tamaño: " . round(filesize($pharFile) / (1024*1024), 2) . " MB\n";
          ?>
          EOL

      - name: Build PHAR
        run: php build-phar.php

      - name: Upload PHAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Submarine-PH AR
          path: Submarine.phar
          if-no-files-found: error
          retention-days: 30

      - name: Show info
        run: |
          ls -lh *.phar
          echo "Workflow completado."
